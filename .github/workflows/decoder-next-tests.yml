name: Lyric Decoder candidate tests

on:
  pull_request:
    paths:
      - 'decoder-next/**'
      - '.github/workflows/decoder-next-tests.yml'
  push:
    branches:
      - decoder-checkpoint-safety
    paths:
      - 'decoder-next/**'
      - '.github/workflows/decoder-next-tests.yml'

permissions:
  contents: read

jobs:
  isolated-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release verifier dependency
        run: python3 -m pip install -r manager-updater/requirements.txt
      - name: Test synthetic Decoder and Manager release compatibility
        run: python3 -B -m unittest discover -s decoder-next -p 'test_*.py' -v
