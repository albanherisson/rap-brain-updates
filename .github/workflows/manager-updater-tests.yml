name: Manager updater safety tests
on:
  push:
    paths:
      - "manager-updater/**"
      - ".github/workflows/manager-updater-tests.yml"
  pull_request:
    paths:
      - "manager-updater/**"
      - ".github/workflows/manager-updater-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    name: Python safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install signature verification dependency
        run: python -m pip install -r manager-updater/requirements.txt
      - name: Run updater tests on disposable fixtures
        run: python -m unittest discover -s manager-updater -p 'test_*.py' -v
  mac-python-tests:
    name: macOS Python transaction tests
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install signature verification dependency
        run: python -m pip install -r manager-updater/requirements.txt
      - name: Run updater regression suite on macOS
        run: python -m unittest discover -s manager-updater -p 'test_*.py' -v
      - name: Check integration fixture syntax without opening sockets
        run: python -m py_compile manager-updater/fixture_restart_lab.py manager-updater/fixture_transaction_restart_lab.py
      - name: Build and verify disposable Finder bootstrap app
        run: |
          python -B manager-updater/build_first_bootstrap_app.py "$RUNNER_TEMP/Installer Rap Brain.app"
          /usr/bin/codesign --verify --deep --strict "$RUNNER_TEMP/Installer Rap Brain.app"
          test -f "$RUNNER_TEMP/Installer Rap Brain.app/Contents/Resources/updater/first_bootstrap_installer.py"
  mac-cryptokit:
    name: macOS CryptoKit identity test
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned publisher identity and tamper rejection
        run: swift manager-updater/mac_readonly_signature_test.swift
